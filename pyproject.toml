[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rare-mva"
version = "0.1.0"
description = "Safe Rescue decision rule, Track 1 validation and scoring tools, and public-data analyses for the 2026 MVA hackathon"
readme = "README.md"
requires-python = ">=3.11"
license = "CC-BY-4.0"
authors = [{ name = "Vasilis Balafas" }]
dependencies = []
classifiers = [
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9"]
figures = ["matplotlib>=3.8"]

[project.scripts]
rare-mva = "rare_mva.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-markers"
testpaths = ["tests"]

